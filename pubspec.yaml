name: krishimitra
description: "KrishiMitra - agricultural assistance platform for Indian farmers."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  url_launcher: ^6.2.5
  cupertino_icons: ^1.0.8

  flutter_riverpod: ^2.6.1
  go_router: ^14.2.0
  shared_preferences: ^2.3.2
  http: ^1.2.2
  google_fonts: ^6.2.1
  path_provider: ^2.1.5
  permission_handler: ^11.3.1
  open_filex: ^4.6.0
  share_plus: ^10.1.4


dev_dependencies:
  flutter_launcher_icons: ^0.13.1

  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"

flutter:
  uses-material-design: true

  # ✅ CORRECT PLACE FOR ASSETS
  assets:
    - lib/data/schemes.json